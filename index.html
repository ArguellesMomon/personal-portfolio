<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Richmond Arguelles — Computer Science Portfolio</title>
    <meta
      name="description"
      content="Computer Science student building web, mobile, and embedded ML projects — from a thesis-level mosquito detection system to smaller full-stack apps."
    />

    <!-- Favicon (see public/favicon.ico + public/favicon-*.png, generated
         from the site's own '>' bracket motif — the same mark used in
         every "‹ Verify ›"-style label across the site, not an invented
         monogram). apple-touch-icon covers iOS home-screen bookmarks. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d0c0b" />

    <!-- Open Graph / Twitter card — og-card.png (public/og-card.png) was
         generated to match the site's own look (dark bg, signal-orange
         accent, Space Grotesk, the real hero portrait) rather than
         leaving link previews blank. NOTE: the image file itself still has
         the old placeholder name baked in as pixels — regenerate og-card.png
         to match the name now set in the meta tags above. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Richmond Arguelles — Computer Science Portfolio" />
    <meta property="og:description" content="Computer Science student building web, mobile, and embedded ML projects — from a thesis-level mosquito detection system to smaller full-stack apps." />
    <meta property="og:image" content="/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Richmond Arguelles — Computer Science Portfolio" />
    <meta name="twitter:description" content="Computer Science student building web, mobile, and embedded ML projects — from a thesis-level mosquito detection system to smaller full-stack apps." />
    <meta name="twitter:image" content="/og-card.png" />

    <!-- Fonts: Space Grotesk (display), Inter (body), JetBrains Mono (utility) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
