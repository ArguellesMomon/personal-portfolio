    <script>
      // Apply the stored or OS theme before the first paint.
      try {
        var preference = localStorage.getItem('portfolio-theme');
        var theme =
          preference === 'dark' || preference === 'light'
            ? preference
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#141d18' : '#f7f5ee';
      } catch (_) {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
    </script>
    <script>
      // Keep a paused or reduced-motion visit still from the first paint.
      try {
        document.documentElement.dataset.motion =
          localStorage.getItem('portfolio-motion') === 'paused' ||
          matchMedia('(prefers-reduced-motion: reduce)').matches
            ? 'reduced'
            : 'full';
      } catch (_) {
        document.documentElement.dataset.motion = matchMedia('(prefers-reduced-motion: reduce)')
          .matches
          ? 'reduced'
          : 'full';
      }
    </script>
  </head>
